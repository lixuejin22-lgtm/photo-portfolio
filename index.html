<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>摄影作品集</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<!-- 顶部导航 -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo">📷 <span>LENS</span></div>
    <nav>
      <a href="#" class="nav-link active" data-filter="all">全部</a>
      <a href="#" class="nav-link" data-filter="landscape">风光</a>
      <a href="#" class="nav-link" data-filter="portrait">人像</a>
      <a href="#" class="nav-link" data-filter="street">街拍</a>
      <a href="#" class="nav-link" data-filter="bookmarks" id="bookmark-tab">
        <i class="fa-solid fa-bookmark"></i> 收藏
      </a>
    </nav>
    <div class="header-right">
      <span class="stats-badge" id="like-count">❤️ 0</span>
      <span class="stats-badge" id="bookmark-count">🔖 0</span>
    </div>
  </div>
</header>

<!-- 英雄区 -->
<section class="hero">
  <div class="hero-text">
    <h1>用光影记录世界</h1>
    <p>Sony A7M4 · 每一帧都是故事</p>
  </div>
</section>

<!-- 作品网格 -->
<main class="gallery-wrap">
  <div class="gallery" id="gallery">
    <!-- 卡片由 JS 生成 -->
  </div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <i class="fa-solid fa-bookmark"></i>
    <p>还没有收藏的作品</p>
  </div>
</main>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close"><i class="fa-solid fa-xmark"></i></button>
  <button class="lb-nav lb-prev" id="lb-prev"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="lb-nav lb-next" id="lb-next"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="lb-content">
    <img id="lb-img" src="" alt=""/>
    <div class="lb-info">
      <h2 id="lb-title"></h2>
      <p id="lb-desc"></p>
      <div class="lb-actions">
        <button class="btn-action" id="lb-like"><i class="fa-heart fa-regular"></i> <span id="lb-like-count">0</span></button>
        <button class="btn-action" id="lb-bookmark"><i class="fa-bookmark fa-regular"></i> 收藏</button>
      </div>
    </div>
  </div>
</div>
<div class="lb-overlay" id="lb-overlay"></div>

<!-- 上传提示浮层 -->
<button class="fab-upload" id="fab-upload" title="上传作品">
  <i class="fa-solid fa-plus"></i>
</button>

<div class="upload-modal" id="upload-modal" style="display:none;">
  <div class="upload-box">
    <h3>上传作品</h3>
    <input type="file" id="file-input" accept="image/*" multiple/>
    <label for="file-input" class="upload-label">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <span>点击或拖入图片</span>
    </label>
    <input type="text" id="photo-title" placeholder="作品标题" class="text-input"/>
    <input type="text" id="photo-desc" placeholder="简介（可选）" class="text-input"/>
    <select id="photo-cat" class="text-input">
      <option value="landscape">风光</option>
      <option value="portrait">人像</option>
      <option value="street">街拍</option>
    </select>
    <div class="upload-preview" id="upload-preview"></div>
    <div class="modal-btns">
      <button class="btn-cancel" id="upload-cancel">取消</button>
      <button class="btn-submit" id="upload-submit">发布</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>© 2026 · Powered by Sony A7M4 & ❤️</p>
</footer>

<script src="app.js"></script>
</body>
</html>
